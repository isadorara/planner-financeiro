<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
                
        <!--Icones-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <!--Menu Lateral-->
        <!--
        <div id="side_menu" class="side_menu">
            <button id="bt_relatorio" class="bt_side_menu">
                <i class="fa-solid fa-table"></i>
                <a>relatório</a>
            </button>
            <button id="bt_meses" class="bt_side_menu">
                <i class="fa-solid fa-calendar"></i>
                <a>outros meses</a>
            </button>
            <button id="bt_analisar" class="bt_side_menu">
                <i class="fa-solid fa-shopping-bag"></i>
                <a>analisar gasto</a>
            </button>
        </div>
        -->
        
        <!--Pagina principal-->
        <div class="main">
            <h2 class="titulo">Relatório Financeiro</h2>
            <!--Área de upload de csv-->
            <div class="area_upload">
                <i class="fa-solid fa-plus"></i>
                <a>Clique para escolher ou arraste o arquivo aqui</a>
                <!--Upload de arquivo-->
                <input type="file" id="fileInput" accept=".csv,text/csv">
                <button type="submit" id="fileButton" >Enviar</button>
            </div>
            <!--Área de input do usuário-->
            <div class="area_input">
                <div class="input_saida">
                    <label for="input_saida">Saída:</label>
                    <input type="text" id="input_saida" placeholder="Saída">
                </div>
                
                <div class="input_valor">
                    <label for="input_valor">Valor:</label>
                    <input type="number" id="input_valor" placeholder="Valor">
                </div>
                
                <div class="input_categoria">
                    <label for="input_categoria">Categoria:</label>
                    <select id="input_categoria">
                        <option value="Alimentação">Alimentação</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Saúde">Saúde</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Moradia">Moradia</option>
                        <option value="Assinatura">Assinatura</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="input_data">
                    <label for="input_data">Data:</label>
                    <input type="date" id="input_data" placeholder="Data">
                </div>

                <button type="submit" id="inputButton">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <div class="area_total">
                <h2 id="total" class="total">Total</h2>
                <a id="val_total" class="val_total"></a>
            </div>            
            <!--Área de tabela-->
            <div class="area_table">
                <table id="tabela" class="tabela">
                    <thead>
                        <tr>
                            <th>Saída</th>
                            <th>Valor (R$)</th>
                            <th>Categoria</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!--Conteudo da tabela-->
                    </tbody>
                </table>
            </div>
        </div>
    </body>
    <script type="module" src="main.js"></script>
</html>
