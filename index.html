<html>
    <head>
        <!--<link rel="stylesheet" href="style.css">--> 
        
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <!--Menu Lateral-->
        <div id="side_menu" class="side_menu">
            <button id="bt_relatorio" class="bt_side_menu">
                <!--Table_Icon-->
                <i class="fa-solid fa-table"></i>
                <a>relatório</a>
            </button>
            <button id="bt_meses" class="bt_side_menu">
                <!--Calendar_Icon-->
                <i class="fa-solid fa-calendar"></i>
                <a>outros meses</a>
            </button>
            <button id="bt_analisar" class="bt_side_menu">
                <!--Bag_Icon-->
                <i class="fa-solid fa-shopping-bag"></i>
                <a>analisar gasto</a>
            </button>
        </div>
        
        <!--Pagina principal-->
        <div class="main">
            <div class="area_upload">
                <i class="fa-solid fa-plus"></i>
                <a>Clique para escolher ou arraste o arquivo aqui</a>
                <!--Upload de arquivo-->
                <input type="file" id="fileInput" accept=".csv,text/csv">
            </div>
            <div class="total">
                <h2 id="total">Total</h2>
                <h3 id="val_total" class="val_total"></h3>
            </div>
        </div>
    </body>
    <script src="main.js"></script>
</html>
